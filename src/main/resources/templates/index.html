<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/comunes :: head_resources('LUXE | Iniciar Sesión')}"></th:block>
</head>

<body class="login-body">
    <main class="container-fluid">
        <div class="row min-vh-100">

            <!-- PARTE IZQUIERDA -->
            <div class="col-lg-7 login-presentacion d-none d-lg-flex">
                <div class="presentacion-contenido">
                    <div class="marca-grande">LUXE</div>
                    <p class="texto-marca">SISTEMA DE GESTIÓN DE VENTAS</p>
                    <div class="linea-dorada"></div>
                    <h2>"Viste con clase,<br>vive con estilo"</h2>
                    <p>Usa responsablemente tus credenciales, no compartas tu contraseña.</p>
                </div>
            </div>

            <!-- LOGIN -->
            <div class="col-lg-5 d-flex align-items-center justify-content-center">
                <div class="login-card">

                    <div class="text-center mb-4">
                        <div class="logo-login">LUXE</div>
                        <p class="text-muted small mb-0">Sistema de Gestión de Ventas POS</p>
                    </div>

                    <!-- Mensaje de error desde Spring Controller -->
                    <div th:if="${error != null}" class="alert alert-danger" role="alert">
                        <i class="bi bi-exclamation-circle"></i>
                        <span th:text="${error}">Usuario o contraseña incorrectos.</span>
                    </div>

                    <form th:action="@{/login}" method="post" id="formLogin">
                        <div class="mb-3">
                            <label class="form-label">Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-person"></i>
                                </span>
                                <input type="text"
                                       name="usuario"
                                       id="usuario"
                                       class="form-control"
                                       placeholder="Ingrese su usuario"
                                       required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input type="password"
                                       name="contrasena"
                                       id="password"
                                       class="form-control"
                                       placeholder="Ingrese su contraseña"
                                       required>
                                <button type="button"
                                        class="btn btn-outline-secondary"
                                        onclick="mostrarPassword()">
                                    <i id="iconPassword" class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="recordar">
                            <label class="form-check-label small text-muted" for="recordar">
                                Recordar mi sesión
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 btn-login">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión
                        </button>
                    </form>

                    <div class="mt-4 pt-3 border-top text-center text-muted small">
                        <p class="mb-1"><strong>Credenciales de prueba:</strong></p>
                        <span class="badge bg-light text-dark border me-1">Admin: admin / 1234</span>
                        <span class="badge bg-light text-dark border">Vendedor: vendedor / 1234</span>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <!-- JS BOOTSTRAP (FRAGMENTO) -->
    <th:block th:replace="~{fragments/comunes :: scripts_bootstrap}"></th:block>
    <script th:src="@{/js/sistema.js}"></script>
    <script>
        function mostrarPassword() {
            const pwd = document.getElementById("password");
            const icon = document.getElementById("iconPassword");
            if (pwd.type === "password") {
                pwd.type = "text";
                icon.classList.replace("bi-eye", "bi-eye-slash");
            } else {
                pwd.type = "password";
                icon.classList.replace("bi-eye-slash", "bi-eye");
            }
        }
    </script>
</body>
</html>
