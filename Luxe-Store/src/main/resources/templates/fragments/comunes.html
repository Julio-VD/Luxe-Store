<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <!-- 1. FRAGMENTO: RECURSOS DEL HEAD (CSS, BOOTSTRAP, ICONOS) -->
    <th:block th:fragment="head_resources(titulo)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${titulo}">LUXE Store</title>

        <!-- BOOTSTRAP 5 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- ICONOS BOOTSTRAP -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
        <!-- CSS PROPIO -->
        <link rel="stylesheet" th:href="@{/css/estilos.css}">
    </th:block>

    <!-- 2. FRAGMENTO: LOGO DE LA BARRA LATERAL -->
    <div th:fragment="logo_sidebar(subtitulo)" class="logo-sidebar text-center mb-4">
        <h2>LUXE</h2>
        <p class="text-gold small mb-0" th:text="${subtitulo}">PANEL</p>
    </div>

    <!-- 3. FRAGMENTO: INFORMACIÓN DEL USUARIO LOGUEADO Y CIERRE DE SESIÓN -->
    <div th:fragment="user_info" class="user-info pt-3 border-top border-secondary text-center">
        <p class="mb-1 text-light small fw-bold" th:text="${usuarioLogueado != null ? usuarioLogueado.nombreCompleto : 'Usuario'}">Usuario</p>
        <span class="badge" 
              th:classappend="${usuarioLogueado != null and usuarioLogueado.rol == 'ADMIN'} ? 'bg-gold text-dark' : 'bg-secondary text-white'" 
              th:text="${usuarioLogueado != null ? usuarioLogueado.rol : 'VENDEDOR'}">ROL</span>
        <div class="mt-3">
            <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm w-100">
                <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
            </a>
        </div>
    </div>

    <!-- 4. FRAGMENTO: ALERTAS FLASH (MENSAJES DE ÉXITO Y ERROR) -->
    <div th:fragment="alertas_flash">
        <div th:if="${mensaje != null}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${mensaje}">Operación realizada con éxito.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}">Error en la operación.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <!-- 5. FRAGMENTO: SCRIPTS JS DE BOOTSTRAP BUNDLE -->
    <th:block th:fragment="scripts_bootstrap">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </th:block>

</body>
</html>
