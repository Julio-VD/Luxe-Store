<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
</head>

<body>

    <!-- 1. FRAGMENTO: RECURSOS DEL HEAD (CSS, BOOTSTRAP, ICONOS) -->
    <th:block th:fragment="head_resources(titulo)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${titulo}">LUXE Store</title>

        <!-- BOOTSTRAP 5 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- ICONOS BOOTSTRAP -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
        <!-- CSS PROPIO -->
        <link rel="stylesheet" th:href="@{/css/estilos.css}">
    </th:block>

    <!-- 2. FRAGMENTO: LOGO DE LA BARRA LATERAL -->
    <div th:fragment="logo_sidebar(subtitulo)" class="logo-sidebar text-center mb-4">
        <h2>LUXE</h2>
        <p class="text-gold small mb-0" th:text="${subtitulo}">PANEL</p>
    </div>

    <!-- 3. FRAGMENTO: INFORMACIÓN DEL USUARIO LOGUEADO Y CIERRE DE SESIÓN -->
    <div th:fragment="user_info" class="user-info pt-3 border-top border-secondary text-center">
        <p class="mb-1 text-light small fw-bold"
            th:text="${usuarioLogueado != null ? usuarioLogueado.nombreCompleto : 'Usuario'}">Usuario</p>
        <span class="badge"
            th:classappend="${usuarioLogueado != null and usuarioLogueado.rol == 'ADMIN'} ? 'bg-gold text-dark' : 'bg-secondary text-white'"
            th:text="${usuarioLogueado != null ? usuarioLogueado.rol : 'VENDEDOR'}">ROL</span>
        <div class="mt-3">
            <a th:href="@{/logout}" onclick="try { sessionStorage.removeItem('luxe_pos_carrito'); } catch (e) {}" class="btn btn-outline-danger btn-sm w-100">
                <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
            </a>
        </div>
    </div>

    <!-- 4. FRAGMENTO: ALERTAS FLASH (MENSAJES DE ÉXITO Y ERROR) -->
    <div th:fragment="alertas_flash">
        <div class="modal fade" id="modalAvisoSistema" tabindex="-1" aria-hidden="true"
            th:if="${mensaje != null or error != null}">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content shadow">
                    <div class="modal-header"
                        th:classappend="${error != null} ? 'bg-danger text-white' : 'bg-success text-white'">
                        <h5 class="modal-title"
                            th:text="${error != null} ? 'No se pudo completar' : 'Operación exitosa'">Operación exitosa
                        </h5>
                        <button type="button" class="btn-close"
                            th:classappend="${error != null} ? 'btn-close-white' : ''" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body"><i
                            th:class="${error != null} ? 'bi bi-exclamation-triangle-fill text-danger fs-3 me-2' : 'bi bi-check-circle-fill text-success fs-3 me-2'"></i><span
                            th:text="${error != null ? error : mensaje}">Operación realizada.</span></div>
                    <div class="modal-footer"><button type="button" class="btn btn-dark"
                            data-bs-dismiss="modal">Aceptar</button></div>
                </div>
            </div>
        </div>
        <script th:if="${mensaje != null or error != null}">
            document.addEventListener('DOMContentLoaded', function () { var el = document.getElementById('modalAvisoSistema'); if (el && window.bootstrap) new bootstrap.Modal(el).show(); });
        </script>
    </div>

    <!-- 5. FRAGMENTO: SCRIPTS JS DE BOOTSTRAP BUNDLE -->
    <th:block th:fragment="scripts_bootstrap">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </th:block>

</body>

</html>
