<title>Login - Aura University</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
    body {
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #0d6efd, #6f42c1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
    }

    .login-container {
        width: 100%;
        max-width: 950px;
        padding: 20px;
    }

    .login-card {
        background-color: white;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
    }

    .login-left {
        background: linear-gradient(135deg, #0d6efd, #6f42c1);
        color: white;
        min-height: 520px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px;
    }

    .login-left .icon {
        width: 100px;
        height: 100px;
        background-color: rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 25px;
    }

    .login-left i {
        font-size: 55px;
    }

    .login-left h1 {
        font-weight: bold;
        margin-bottom: 15px;
    }

    .login-left p {
        font-size: 16px;
        opacity: 0.9;
    }

    .login-right {
        padding: 55px 45px;
        min-height: 520px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .login-right h2 {
        font-weight: bold;
        color: #212529;
        margin-bottom: 10px;
    }

    .subtitle {
        color: #6c757d;
        margin-bottom: 30px;
    }

    .form-label {
        font-weight: 600;
    }

    .input-group-text {
        background-color: #f8f9fa;
    }

    .form-control {
        height: 48px;
    }

    .btn-login {
        height: 48px;
        font-weight: bold;
        border-radius: 8px;
        background: linear-gradient(90deg, #0d6efd, #6f42c1);
        border: none;
    }

    .btn-login:hover {
        opacity: 0.9;
    }

    .forgot-password {
        text-decoration: none;
        font-size: 14px;
    }

    .role-info {
        margin-top: 25px;
        padding: 12px;
        background-color: #f8f9fa;
        border-radius: 8px;
        font-size: 13px;
        color: #6c757d;
        text-align: center;
    }

    @media (max-width: 768px) {
        .login-left {
            min-height: 280px;
            padding: 30px;
        }

        .login-left .icon {
            width: 75px;
            height: 75px;
        }

        .login-left i {
            font-size: 40px;
        }

        .login-left h1 {
            font-size: 25px;
        }

        .login-right {
            min-height: auto;
            padding: 40px 25px;
        }
    }
</style>
```

</head>

<body>

```
<div class="container-fluid login-container">

    <div class="row login-card g-0">

        <!-- LADO IZQUIERDO -->
        <div class="col-md-6 login-left">

            <div class="icon">
                <i class="bi bi-mortarboard-fill"></i>
            </div>

            <h1>AURA UNIVERSITY</h1>

            <p>
               Inicio de clases 1 de Enero
            </p>

            <p>
                "Asegura tu futuro con nosotros"
            </p>

        </div>

        <!-- LADO DERECHO -->
        <div class="col-md-6 login-right">

            <h2>Iniciar Sesión</h2>

            <p class="subtitle">
                Ingresa tus credenciales para acceder al sistema.
            </p>

            <form>

                <!-- USUARIO -->
                <div class="mb-3">

                    <label for="usuario" class="form-label">
                        Usuario
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>

                        <input
                            type="text"
                            class="form-control"
                            id="usuario"
                            placeholder="Ingresa tu usuario"
                            required
                        >

                    </div>

                </div>

                <!-- CONTRASEÑA -->
                <div class="mb-3">

                    <label for="password" class="form-label">
                        Contraseña
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Ingresa tu contraseña"
                            required
                        >

                        <button
                            class="btn btn-outline-secondary"
                            type="button"
                            onclick="mostrarPassword()"
                        >
                            <i class="bi bi-eye" id="iconPassword"></i>
                        </button>

                    </div>

                </div>

                <!-- RECORDAR / RECUPERAR -->
                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="recordar"
                        >

                        <label
                            class="form-check-label"
                            for="recordar"
                        >
                            Recordarme
                        </label>

                    </div>

                    <a href="#" class="forgot-password">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>

                <!-- BOTÓN -->
                <button
                    type="submit"
                    class="btn btn-primary btn-login w-100"
                >
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Ingresar
                </button>

                <!-- ROLES -->
                <div class="role-info">

                    <i class="bi bi-info-circle me-1"></i>

                    Acceso para:
                    <strong>Administrador</strong>,
                    <strong>Estudiante</strong> y
                    <strong>Asesor</strong>.

                </div>

            </form>

        </div>

    </div>

</div>

<!-- JAVASCRIPT -->
<script>
    function mostrarPassword() {

        const password = document.getElementById("password");
        const icon = document.getElementById("iconPassword");

        if (password.type === "password") {

            password.type = "text";

            icon.classList.remove("bi-eye");
            icon.classList.add("bi-eye-slash");

        } else {

            password.type = "password";

            icon.classList.remove("bi-eye-slash");
            icon.classList.add("bi-eye");
        }
    }
</script>
